<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#263f34">
<meta name="description" content="おうちごはんのメニュー。気になる料理を選んで送ってね。">
<title>おうちごはん | お品書き</title>
<style>
:root{--ink:#263f34;--sub:#63736a;--paper:#fbf8f1;--white:#fffdf9;--line:#e5e6db;--accent:#ae674b;--soft:#eaf0e8}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Noto Sans JP","Yu Gothic",Meiryo,sans-serif;line-height:1.65}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible{outline:3px solid #d09e80;outline-offset:3px}.wrap{max-width:1150px;margin:auto;padding:0 24px}
header{background:var(--white);border-bottom:1px solid var(--line)}.head{display:flex;align-items:center;justify-content:space-between;gap:18px;min-height:72px}.brand{text-decoration:none;font-size:19px;font-weight:800;letter-spacing:.07em}.brand span{color:var(--accent)}.head button,.primary{border:0;border-radius:100px;background:var(--ink);color:white;padding:11px 21px;font-size:13px;font-weight:800}.head button:hover,.primary:hover{background:#3a6150}
.hero{display:grid;grid-template-columns:1.02fr .98fr;background:var(--soft);border-radius:22px;overflow:hidden;margin:26px 0 0;min-height:350px}.hero-copy{padding:58px 52px;display:flex;flex-direction:column;justify-content:center}.eyebrow{font-size:11px;font-weight:800;letter-spacing:.21em;color:var(--accent);margin:0 0 17px}.hero h1{font-family:"Yu Mincho","Hiragino Mincho ProN",Georgia,serif;font-weight:700;font-size:clamp(36px,4.8vw,58px);line-height:1.32;letter-spacing:.045em;margin:0 0 18px}.hero p.lead{font-size:15px;color:#566c5c;margin:0 0 27px;line-height:1.85}.hero .primary{align-self:flex-start;text-decoration:none}.hero-image{position:relative;min-height:290px;background:linear-gradient(120deg,#8ca790,#c8d7bf);overflow:hidden}.hero-image img{width:100%;height:100%;object-fit:cover;position:absolute;inset:0}.hero-image span{position:absolute;bottom:14px;right:16px;background:rgba(255,253,248,.94);border-radius:8px;padding:5px 11px;font-size:11px;color:var(--ink)}
.menu{padding:57px 0 84px}.section-head{display:flex;justify-content:space-between;align-items:end;gap:20px}.section-head h2{font-family:"Yu Mincho","Hiragino Mincho ProN",serif;font-size:34px;margin:0 0 5px;letter-spacing:.06em}.hint{color:var(--sub);font-size:12px;margin:0}.search-tools{display:flex;justify-content:space-between;align-items:center;gap:14px;flex-wrap:wrap;margin:26px 0 18px}.tabs{display:flex;gap:8px;flex-wrap:wrap}.tab{border:1px solid #d5ddd2;border-radius:100px;background:white;padding:9px 16px;color:#536759;font-size:12px;font-weight:800}.tab.active{background:var(--ink);border-color:var(--ink);color:white}.search{border:1px solid #d6ddd1;border-radius:100px;background:#fff;padding:9px 15px;font-size:13px;color:var(--ink);min-width:180px;width:215px}.count{font-size:12px;color:var(--sub);margin:0 0 15px}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}.dish{min-width:0;background:var(--white);border:1px solid #e8e5dc;border-radius:15px;overflow:hidden;display:flex;flex-direction:column;box-shadow:0 5px 18px rgba(30,55,38,.025)}.dish.chosen{border-color:#6d9b78;box-shadow:0 0 0 1px #6d9b78}.media{height:195px;position:relative;background:linear-gradient(130deg,#d9e0d2,#e8ddd0);overflow:hidden}.media img{width:100%;height:100%;object-fit:cover}.photo-caption{position:absolute;left:10px;top:10px;background:rgba(255,253,248,.94);padding:4px 9px;border-radius:30px;font-size:10px;font-weight:700}.photo-link{position:absolute;right:10px;bottom:10px;background:rgba(255,253,248,.94);padding:4px 8px;border-radius:6px;font-size:10px;text-decoration:none}.media.is-empty img,.media.is-empty .photo-caption,.media.is-empty .photo-link{display:none}.media.is-empty:after{content:"";position:absolute;inset:0;background:radial-gradient(circle at 24% 32%,rgba(255,255,255,.6) 0 18%,transparent 19%),linear-gradient(120deg,#e6e2d4,#cedbcc)}.dish.no-photo .media{height:0}.dish-body{display:flex;flex-direction:column;flex:1;padding:19px}.dish h3{font-size:18px;line-height:1.45;margin:0 0 9px;font-weight:800;letter-spacing:.01em;overflow-wrap:anywhere}.dish-desc{font-size:12px;color:var(--sub);margin:0 0 20px;flex:1}.dish-bottom{display:flex;justify-content:flex-end;border-top:1px solid #ecebe3;padding-top:13px}.pick{border:1px solid #b6c9b9;background:white;color:var(--ink);border-radius:100px;padding:8px 15px;font-size:12px;font-weight:800}.pick[aria-pressed="true"]{background:var(--ink);color:white;border-color:var(--ink)}.empty{grid-column:1/-1;padding:50px 20px;text-align:center;color:var(--sub)}
footer{border-top:1px solid var(--line);padding:22px 0 40px;font-size:12px;color:var(--sub);text-align:center}
.float{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(120px);transition:transform .25s;z-index:20;display:flex;justify-content:space-between;align-items:center;gap:25px;min-width:min(92vw,470px);background:var(--ink);color:#fff;padding:11px 12px 11px 19px;border-radius:100px;box-shadow:0 12px 36px rgba(0,0,0,.2);font-size:13px;font-weight:800}.float.show{transform:translateX(-50%) translateY(0)}.float button{border:0;border-radius:100px;background:white;color:var(--ink);font-size:12px;font-weight:900;padding:11px 18px}
.backdrop{display:none;position:fixed;inset:0;background:rgba(11,29,19,.46);z-index:30}.backdrop.show{display:block}.drawer{position:fixed;right:0;top:0;height:100dvh;width:min(440px,100%);background:var(--white);z-index:31;transform:translateX(102%);transition:transform .25s;display:flex;flex-direction:column;box-shadow:-5px 0 35px rgba(0,0,0,.14)}.drawer.show{transform:translateX(0)}.drawer-head{padding:24px 26px 19px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}.drawer-head h2{font-size:23px;margin:0}.cross{border:0;background:transparent;color:var(--ink);font-size:29px;padding:0 8px}.drawer-content{padding:20px 26px;overflow-y:auto;flex:1}.picked-item{display:flex;gap:10px;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:11px 0;font-size:14px}.remove{border:0;background:transparent;color:var(--accent);font-size:22px}.field{margin:21px 0}.field label{display:block;font-size:12px;font-weight:800;margin-bottom:8px}.field input,.field textarea{width:100%;border:1px solid #d9ded5;background:#fff;border-radius:9px;padding:11px;font-size:14px}.field textarea{min-height:84px;resize:vertical}.drawer-actions{border-top:1px solid var(--line);padding:19px 26px 25px}.drawer-actions button{width:100%;margin:0 0 9px;border-radius:10px;padding:12px;font-weight:800;border:1px solid #d7e0d9}.copy{background:var(--ink);color:white}.share{background:#eff2eb;color:var(--ink)}.small-note{text-align:center;font-size:11px;color:var(--sub);margin:5px 0 0}.toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);z-index:45;background:#243b2f;color:white;border-radius:9px;padding:10px 18px;font-size:13px;display:none}.toast.show{display:block}
@media(max-width:860px){.hero{grid-template-columns:1fr 1fr}.hero-copy{padding:35px}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}.media{height:175px}}
@media(max-width:560px){.wrap{padding:0 15px}.head{min-height:63px}.brand{font-size:16px}.head button{font-size:11px;padding:9px 12px}.hero{grid-template-columns:1fr;margin-top:14px;min-height:0}.hero-copy{padding:32px 26px 25px}.hero h1{font-size:34px}.hero p.lead{font-size:13px;margin-bottom:20px}.hero-image{height:190px;min-height:0}.menu{padding-top:38px}.section-head h2{font-size:27px}.search{width:100%}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.media{height:118px}.dish-body{padding:13px}.dish h3{font-size:14px}.dish-desc{font-size:11px;margin-bottom:14px}.pick{font-size:11px;padding:7px 11px}.float{bottom:12px}.drawer-head,.drawer-content,.drawer-actions{padding-left:19px;padding-right:19px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<header><div class="wrap head"><a class="brand" href="#top">おうち<span>ごはん</span>。</a><button id="openTop">選んだ料理 <span id="topCount">0</span></button></div></header>
<main id="top" class="wrap">
<section class="hero" aria-label="ご案内"><div class="hero-copy"><p class="eyebrow">わが家へようこそ</p><h1>今日は、<br>何を食べたい？</h1><p class="lead">好きな料理を選んで送ってね。<br>できれば前日までに教えてくれるとうれしいです。</p><a class="primary" href="#menu">メニューを見る ↓</a></div><div class="hero-image"><img id="heroImg" alt="麻婆豆腐の参考写真" decoding="async"><span>写真はイメージです</span></div></section>
<section id="menu" class="menu"><div class="section-head"><div><p class="eyebrow">気になる料理を選んでね</p><h2>お品書き</h2></div><p class="hint">全37品 · 写真は参考です</p></div>
<div class="search-tools"><div id="tabs" class="tabs" role="group" aria-label="料理のカテゴリー"><button class="tab active" data-cat="all" aria-pressed="true">すべて</button><button class="tab" data-cat="mains" aria-pressed="false">メイン</button><button class="tab" data-cat="pasta" aria-pressed="false">パスタ</button><button class="tab" data-cat="sides" aria-pressed="false">小鉢・軽食</button><button class="tab" data-cat="breakfast" aria-pressed="false">朝食・その他</button></div><input id="search" class="search" type="search" placeholder="料理をさがす" aria-label="料理を検索" autocomplete="off"></div>
<p id="count" class="count"></p><div id="grid" class="grid"></div></section>
</main>
<footer><div class="wrap">手料理なので、食材やアレルギーについては事前に相談してね。<br>写真：Wikimedia Commons（各写真から出典を確認できます）</div></footer>
<div id="float" class="float"><span id="floatCount">0品選択中</span><button id="openFloat">選んだ料理を見る ↗</button></div>
<div id="backdrop" class="backdrop"></div><aside id="drawer" class="drawer" role="dialog" aria-modal="true" aria-label="選んだ料理" aria-hidden="true"><div class="drawer-head"><h2>選んだ料理 <span id="drawerCount">0</span>品</h2><button class="cross" id="close" aria-label="閉じる">×</button></div><div class="drawer-content"><div id="list"></div><div class="field"><label for="guest">お名前（任意）</label><input id="guest" type="text" maxlength="80" placeholder="お名前"></div><div class="field"><label for="notes">アレルギー・リクエスト（任意）</label><textarea id="notes" maxlength="800" placeholder="苦手な食材、辛さの希望など"></textarea></div></div><div class="drawer-actions"><button id="copy" class="copy">メッセージをコピー</button><button id="share" class="share">スマホで共有</button><p class="small-note">選択内容は自動送信されません。</p></div></aside>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
'use strict';
const items=[
[1,'pasta','プッタネスカ','トマト・オリーブ・ケッパー'],
[2,'pasta','サーモンとじゃがいもの冷製ジェノベーゼ','サーモン・バジル・じゃがいも'],
[3,'mains','紅焼牛肉（牛肉の醤油煮込み）','牛肉・醤油・香辛料'],
[4,'mains','トマトと卵の中華炒め','トマト・卵'],
[5,'mains','ビーフカレー','牛肉・じゃがいも・玉ねぎ'],
[6,'mains','スペイン風ガーリックチキン','鶏肉・にんにく・オリーブオイル'],
[7,'mains','フランス風牛肉と野菜のスープ','牛肉・野菜・ハーブ'],
[8,'mains','広東風土鍋焼き（啫啫煲）','肉・しょうが・にんにく'],
[9,'mains','貴州風つけだれ火鍋','肉・野菜・唐辛子だれ'],
[10,'mains','麻婆豆腐','豆腐・ひき肉・豆板醤'],
[11,'pasta','ボンゴレ・ビアンコ','あさり・にんにく・白ワイン'],
[12,'mains','ディジョンマスタードチキン','鶏肉・マスタード・きのこ'],
[13,'pasta','パスタ・アッラ・グリーチャ','ペコリーノ・豚肉・黒こしょう'],
[14,'mains','鶏肉の白ワイン煮（カッチャトーラ・ビアンコ）','鶏肉・白ワイン・ハーブ'],
[15,'sides','小ねぎの冷ややっこ','豆腐・小ねぎ・ごま油'],
[16,'sides','オクラとおかかの冷ややっこ','豆腐・オクラ・かつお節'],
[17,'sides','目玉焼き','卵'],
[18,'breakfast','パイナップル','フレッシュフルーツ'],
[19,'sides','サーモン／鯛のお刺身','刺身用の魚'],
[20,'breakfast','無調整豆乳＋ミロ','豆乳・MILO'],
[21,'mains','キムチ豆腐鍋','キムチ・豚肉・豆腐'],
[22,'mains','タイ風チキンカレー','鶏肉・ココナッツミルク'],
[23,'mains','牛肉のねぎ塩炒め','薄切り牛肉・ねぎ'],
[24,'pasta','きのこのクリームパスタ','きのこ・クリーム・チーズ'],
[25,'mains','ルイジアナ風レッドビーンズ＆ライス','豆・ソーセージ・ご飯'],
[26,'mains','アルザス風シュークルート','ザワークラウト・ソーセージ・豚肉'],
[27,'sides','ツナ・サーモン・水牛モッツァレラのサラダ','魚・チーズ・野菜'],
[28,'sides','あじのなめろう','あじ・味噌・しょうが'],
[29,'sides','サバのリエット','サバ・クリームチーズ・レモン'],
[30,'sides','サーモンとツナのサラダ','サーモン・ツナ・野菜'],
[31,'breakfast','シンガポール風カヤトーストセット','カヤトースト・半熟卵'],
[32,'mains','韓国風牛肉のサンパプ','牛肉・ご飯・レタス'],
[33,'mains','東北風大飯包（卵みそ・じゃがいも）','ご飯・じゃがいも・卵みそ'],
[34,'sides','中国北方風 塩味豆腐脳','豆腐・きのこ・香味だれ'],
[35,'mains','水餃子・にんにくソーセージ・たたききゅうり','水餃子・ソーセージ・きゅうり'],
[36,'mains','四川風鶏ほぐし冷麺','鶏肉・きゅうり・ごまだれ'],
[37,'sides','白いんげん豆とツナのサラダ','白いんげん豆・ツナ・レモン']
];
const photos={
1:'Puttanesca.JPG',
3:'Chinese Braised Beef (紅燒牛肉).jpg',
4:'Tomato and eggs.JPG',
5:'Beef curry rice 001.jpg',
6:'Pollo al ajillo.jpg',
7:'Pot-au-feu soup.jpg',
10:'Authentic Mapo Tofu.jpg',
11:'Spaghetti alle vongole.jpg',
13:'Pasta alla Gricia.jpg',
18:'Pineapple (sliced).jpg',
19:'Sashimi of salmon.jpg',
21:'Gimchi-jjigae.jpg',
22:'Chicken Thai Green Curry.jpg',
24:'Creamy Mushroom Pasta.jpg',
25:'Red beans and rice.jpg',
26:'Choucroute-garni 1.JPG',
28:'Namerou 001.jpg',
31:'Kaya toast with butter set, Ya Kun Kaya Toast, KLIA1, 2025 (01).jpg',
37:'Salad with beans and tuna.jpg'
};
const selected=new Set();let category='all',term='',focusBack=null,toastTimeout=null;
const $=id=>document.getElementById(id);
function escapeHTML(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function photoSrc(file){return 'https://commons.wikimedia.org/wiki/Special:FilePath/'+encodeURIComponent(file.replace(/ /g,'_'))+'?width=880'}
function source(file){return 'https://commons.wikimedia.org/wiki/File:'+encodeURIComponent(file.replace(/ /g,'_'))}
function render(){
 const list=items.filter(function(d){return (category==='all'||d[1]===category)&&(d[2]+' '+d[3]).toLowerCase().includes(term)});
 $('count').textContent=list.length+'品を表示中';
 $('grid').innerHTML=list.length?list.map(function(d){
   const hasPhoto=!!photos[d[0]],file=photos[d[0]],isPicked=selected.has(d[0]);
   const media=hasPhoto?'<div class="media"><img src="'+photoSrc(file)+'" loading="lazy" decoding="async" alt="'+escapeHTML(d[2])+'の参考写真"><span class="photo-caption">参考写真</span><a class="photo-link" href="'+source(file)+'" target="_blank" rel="noopener noreferrer" aria-label="'+escapeHTML(d[2])+'の写真出典">写真出典 ↗</a></div>':'';
   return '<article class="dish '+(isPicked?'chosen ':'')+(!hasPhoto?'no-photo':'')+'">'+media+'<div class="dish-body"><h3>'+escapeHTML(d[2])+'</h3><p class="dish-desc">'+escapeHTML(d[3])+'</p><div class="dish-bottom"><button class="pick" data-pick="'+d[0]+'" aria-pressed="'+isPicked+'">'+(isPicked?'✓ 選択中':'＋ 選ぶ')+'</button></div></div></article>';
 }).join(''):'<p class="empty">該当する料理がありません。</p>';
 $('grid').querySelectorAll('.media img').forEach(function(image){image.addEventListener('error',function(){image.closest('.media').classList.add('is-empty')})});
 updateCounts();
}
function updateCounts(){const n=selected.size;$('topCount').textContent=n;$('drawerCount').textContent=n;$('floatCount').textContent=n+'品選択中';$('float').classList.toggle('show',n>0);$('list').innerHTML=items.filter(d=>selected.has(d[0])).map(d=>'<div class="picked-item"><span>'+escapeHTML(d[2])+'</span><button class="remove" data-remove="'+d[0]+'" aria-label="'+escapeHTML(d[2])+'を外す">×</button></div>').join('')||'<p class="hint">気になる料理を選んでね。</p>'}
function toggle(id){if(selected.has(id))selected.delete(id);else selected.add(id);render()}
function openDrawer(){focusBack=document.activeElement;$('drawer').classList.add('show');$('backdrop').classList.add('show');$('drawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('close').focus()}
function closeDrawer(){$('drawer').classList.remove('show');$('backdrop').classList.remove('show');$('drawer').setAttribute('aria-hidden','true');document.body.style.overflow='';if(focusBack&&focusBack.focus)focusBack.focus()}
function orderText(){const found=items.filter(d=>selected.has(d[0])).map(d=>'・'+d[2]).join('\n');const name=$('guest').value.trim();const notes=$('notes').value.trim();return '食べてみたい料理はこちらです！\n\n'+(found||'（未選択）')+(name?'\n\n名前：'+name:'')+(notes?'\n\nアレルギー・希望：\n'+notes:'')+'\n\nよろしくお願いします！'}
function notify(s){clearTimeout(toastTimeout);$('toast').textContent=s;$('toast').classList.add('show');toastTimeout=setTimeout(()=>$('toast').classList.remove('show'),2600)}
async function copyOrder(){try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error();await navigator.clipboard.writeText(orderText());notify('コピーしました')}catch(e){const el=document.createElement('textarea');el.value=orderText();document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();notify(ok?'コピーしました':'コピーできませんでした')}}
$('grid').addEventListener('click',function(e){const b=e.target.closest('button[data-pick]');if(b)toggle(Number(b.dataset.pick))});
$('list').addEventListener('click',function(e){const b=e.target.closest('button[data-remove]');if(b)toggle(Number(b.dataset.remove))});
$('tabs').addEventListener('click',function(e){const b=e.target.closest('button[data-cat]');if(!b)return;category=b.dataset.cat;$('tabs').querySelectorAll('button').forEach(function(x){x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()});
$('search').addEventListener('input',function(e){term=e.target.value.trim().toLowerCase();render()});
['openTop','openFloat'].forEach(function(id){$(id).addEventListener('click',openDrawer)});
$('close').addEventListener('click',closeDrawer);$('backdrop').addEventListener('click',closeDrawer);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('drawer').classList.contains('show'))closeDrawer()});
$('copy').addEventListener('click',copyOrder);
$('share').addEventListener('click',async function(){if(navigator.share){try{await navigator.share({title:'食べたい料理',text:orderText()})}catch(e){if(e.name!=='AbortError')await copyOrder()}}else await copyOrder()});
$('heroImg').src=photoSrc(photos[10]);$('heroImg').addEventListener('error',function(){$('heroImg').style.display='none'});
render();
})();
</script>
</body>
</html>
