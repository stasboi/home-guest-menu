 updateCounts();
}
function updateCounts(){const n=selected.size;$('topCount').textContent=n;$('drawerCount').textContent=n;$('floatCount').textContent=n+'品選択中';$('float').classList.toggle('show',n>0);$('list').innerHTML=items.filter(d=>selected.has(d[0])).map(d=>'<div class="picked-item"><span>'+escapeHTML(d[2])+'</span><button class="remove" data-remove="'+d[0]+'" aria-label="'+escapeHTML(d[2])+'を外す">×</button></div>').join('')||'<p class="hint">気になる料理を選んでね。</p>'}
function toggle(id){if(selected.has(id))selected.delete(id);else selected.add(id);render()}
function openDrawer(){focusBack=document.activeElement;$('drawer').classList.add('show');$('backdrop').classList.add('show');$('drawer').setAttribute('aria-hidden','false');document.body.style.overflow='hidden';$('close').focus()}
function closeDrawer(){$('drawer').classList.remove('show');$('backdrop').classList.remove('show');$('drawer').setAttribute('aria-hidden','true');document.body.style.overflow='';if(focusBack&&focusBack.focus)focusBack.focus()}
function orderText(){const found=items.filter(d=>selected.has(d[0])).map(d=>'・'+d[2]).join('\n');const name=$('guest').value.trim();const notes=$('notes').value.trim();return '食べてみたい料理はこちらです！\n\n'+(found||'（未選択）')+(name?'\n\n名前：'+name:'')+(notes?'\n\nアレルギー・希望：\n'+notes:'')+'\n\nよろしくお願いします！'}
function notify(s){clearTimeout(toastTimeout);$('toast').textContent=s;$('toast').classList.add('show');toastTimeout=setTimeout(()=>$('toast').classList.remove('show'),2600)}
async function copyOrder(){try{if(!navigator.clipboard||!navigator.clipboard.writeText)throw Error();await navigator.clipboard.writeText(orderText());notify('コピーしました')}catch(e){const el=document.createElement('textarea');el.value=orderText();document.body.appendChild(el);el.select();const ok=document.execCommand('copy');el.remove();notify(ok?'コピーしました':'コピーできませんでした')}}
$('grid').addEventListener('click',function(e){const b=e.target.closest('button[data-pick]');if(b)toggle(Number(b.dataset.pick))});
$('list').addEventListener('click',function(e){const b=e.target.closest('button[data-remove]');if(b)toggle(Number(b.dataset.remove))});
$('tabs').addEventListener('click',function(e){const b=e.target.closest('button[data-cat]');if(!b)return;category=b.dataset.cat;$('tabs').querySelectorAll('button').forEach(function(x){x.classList.toggle('active',x===b);x.setAttribute('aria-pressed',String(x===b))});render()});
$('search').addEventListener('input',function(e){term=e.target.value.trim().toLowerCase();render()});
['openTop','openFloat'].forEach(function(id){$(id).addEventListener('click',openDrawer)});
$('close').addEventListener('click',closeDrawer);$('backdrop').addEventListener('click',closeDrawer);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&$('drawer').classList.contains('show'))closeDrawer()});
$('copy').addEventListener('click',copyOrder);
$('share').addEventListener('click',async function(){if(navigator.share){try{await navigator.share({title:'食べたい料理',text:orderText()})}catch(e){if(e.name!=='AbortError')await copyOrder()}}else await copyOrder()});
$('clear').addEventListener('click',function(){selected.clear();render();notify('リセットしました')});
const hero=getPhoto(10)||getPhoto(3);if(hero){$('heroImg').src=hero.img;$('heroImg').addEventListener('error',function(){$('heroImg').style.display='none'})}
render();
})();
</script>
</body>
</html>
